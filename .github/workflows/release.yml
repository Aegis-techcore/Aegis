name: Release and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            target: runner
            suffix: ""
          - name: migrations
            target: tooling
            suffix: -tooling
    outputs:
      image_sha: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set lowercase image name
        id: image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate downloadable SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: aegis-${{ matrix.name }}-sbom

  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main' && vars.KUBERNETES_DEPLOY_ENABLED == 'true'
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      namespace: aegis-staging
      values_file: helm/aegis/values-staging.yaml
      image_sha: ${{ needs.publish.outputs.image_sha }}
    secrets: inherit

  deploy-production:
    name: Deploy to production
    if: github.ref == 'refs/heads/main' && vars.KUBERNETES_DEPLOY_ENABLED == 'true'
    needs: [publish, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      namespace: aegis-production
      values_file: helm/aegis/values-production.yaml
      image_sha: ${{ needs.publish.outputs.image_sha }}
    secrets: inherit
