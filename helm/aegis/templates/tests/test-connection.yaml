apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aegis.fullname" . }}-test-connection"
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      command:
        - wget
      args:
        - -qO-
        - "{{ include "aegis.fullname" . }}:{{ .Values.service.port }}/api/health"
