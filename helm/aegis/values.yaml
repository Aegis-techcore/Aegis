replicaCount: 1

image:
  repository: ghcr.io/sharbel0022/aegis
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: aegis.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_DRIVER: auto
  DATABASE_POOL_SIZE: "10"
  NEXT_PUBLIC_SITE_URL: https://aegis.example.com
  SITE_URL: https://aegis.example.com
  OLLAMA_BASE_URL: http://ollama.default.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.2:3b

existingSecret: aegis-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

probes:
  healthPath: /api/health
  readinessPath: /api/ready
  startup:
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

persistence:
  enabled: false
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  storageClass: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30
